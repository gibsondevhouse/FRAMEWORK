name: CI

on:
  push:
    branches: [main, "stage-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      record_baselines:
        description: "Record visual baselines for this OS matrix and upload them as artifacts (instead of comparing)"
        type: boolean
        default: false

# Least privilege: every job only reads the repository. Nothing here pushes, comments or
# releases, so the token GitHub hands the workflow can do nothing else.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to different code.
      # Dependabot (.github/dependabot.yml) proposes the updates and keeps the comments right.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reader/requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reader/frontend/package-lock.json

      - name: Install frontend dependencies & check TypeScript + JS unit tests
        working-directory: reader/frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      # requirements-dev.txt is a hashed lock (compiled from requirements-dev.in): pip installs
      # exactly those versions and refuses any file whose SHA-256 is not in it.
      - name: Install Python dependencies (hash-checked lock)
        run: python -m pip install --require-hashes -r reader/requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run tests (strict browser gate)
        if: ${{ !inputs.record_baselines }}
        working-directory: reader
        env:
          REQUIRE_BROWSER: "1"
        run: python -m pytest tests -q

      - name: Record visual baselines
        if: ${{ inputs.record_baselines }}
        working-directory: reader
        env:
          REQUIRE_BROWSER: "1"
          UPDATE_BASELINES: "1"
        run: python -m pytest tests/test_browser_parity.py -q

      - name: Upload recorded baselines
        if: ${{ inputs.record_baselines }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baselines-${{ matrix.os }}
          path: reader/tests/baselines/

      - name: Upload failing screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failing-screens-${{ matrix.os }}
          path: reader/tests/baselines/**/*.actual.png
          if-no-files-found: ignore
