name: Dependency audit

# Fails when a pinned dependency, Python or frontend, has a known vulnerability. Runs on every
# push and pull request, and once a week so that an advisory published after the last commit is
# still noticed.
on:
  push:
    branches: [main, "stage-*"]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit and npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit (hash-checked lock)
        run: python -m pip install --require-hashes -r reader/requirements-audit.txt

      # Audits every pin in every lock, including the ones for other platforms and Python
      # versions (see the script for why pip-audit alone would skip those).
      - name: Audit Python dependencies
        run: >
          python .github/scripts/audit_python_locks.py
          reader/requirements.txt reader/requirements-dev.txt reader/requirements-audit.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Reads package-lock.json only; nothing is installed. Any severity fails. That the
      # committed bundle in reader/static/dist/ was built from these locked versions is checked
      # by tests/test_dependency_locks.py in the CI workflow, so a lock-only update cannot
      # leave old library code being served.
      - name: Audit frontend dependencies
        if: ${{ !cancelled() }}
        working-directory: reader/frontend
        run: npm audit --package-lock-only
