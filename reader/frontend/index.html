<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FRAMEWORK</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23070708' stroke='%23ffffff' stroke-opacity='.16' stroke-width='1.5'/><path d='M9.5 10h13' stroke='%23E5B84B' stroke-width='2.6' stroke-linecap='round'/><path d='M10.5 10v12.5M10.5 16.5h8.5' stroke='%23FAFAFC' stroke-width='2.4' stroke-linecap='round'/></svg>">
  <link rel="preload" as="font" type="font/woff2" href="/static/fonts/GeistVariable.woff2" crossorigin>
  <link rel="stylesheet" href="/src/styles/styles.css">
  <script>
    // Apply saved reading font size and drawer geometry before first paint to avoid a flash.
    (function () {
      var root = document.documentElement, size = null, motion = null;
      try { size = localStorage.getItem("fontSize"); } catch (e) {}
      root.style.setProperty("--reader-size", (parseInt(size, 10) || 16) + "px");
      try { motion = localStorage.getItem("motionLevel"); } catch (e) {}
      if (motion !== "none" && motion !== "less" && motion !== "full") {
        motion = (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) ? "none" : "full";
      }
      root.dataset.motion = motion;
      // The drawer's width, collapsed state and mode (app.js "Navigation"), so the first paint
      // has the right layout. Older keys (sidebarW, sidebarHidden) are read once as a fallback.
      try {
        var st = {};
        try { st = JSON.parse(localStorage.getItem("railState")) || {}; } catch (e) {}
        var w = st.width || parseInt(localStorage.getItem("sidebarW"), 10);
        if (w >= 220 && w <= 560) root.style.setProperty("--sidebar-w", w + "px");
        var collapsed = st.collapsed != null ? st.collapsed : localStorage.getItem("sidebarHidden") === "1";
        var fly = st.mode === "flyout" || window.matchMedia("(max-width: 900px)").matches;
        var h = location.hash || "#/";
        if (fly) root.classList.add("drawer-fly");
        else if (collapsed) root.classList.add("drawer-collapsed");
        else if (/^#\/?$|^#\/title\/\d+\/?$/.test(h)) root.classList.add("drawer-retracted");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn" id="nav-toggle" title="Show or hide the drawer (⌘B)" aria-label="Show or hide the drawer" aria-controls="sidebar">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="FRAMEWORK home" title="Home"><svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3" stroke="currentColor" stroke-opacity=".28" stroke-width="1.1" fill="none"/><path class="brand-mark-bar" d="M4.75 5h6.5" stroke-width="1.6" stroke-linecap="round"/><path d="M5.25 5v6.25M5.25 8.25h4.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="brand-text" aria-hidden="true">FRAMEWORK</span></a>
    <span class="topbar-sep" aria-hidden="true">/</span>
    <div class="title-menu" id="title-menu">
      <button type="button" id="title-select" class="title-select" aria-haspopup="menu" aria-expanded="false" aria-controls="title-pop" title="Switch CFR title">
        <span class="title-select-num" id="title-select-num"></span><span class="title-select-name" id="title-select-name"></span>
        <svg class="icon title-select-caret" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg>
      </button>
      <div class="title-pop" id="title-pop" role="menu" aria-label="Titles" hidden></div>
    </div>
    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.2 10.2 3.3 3.3"/></svg>
      <input id="search" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-dropdown" placeholder="Search regulations or jump to a section…" aria-label="Search regulations" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd" aria-hidden="true">⌘K</kbd>
      <div id="search-dropdown" class="search-dropdown" role="listbox" hidden></div>
    </div>
    <span class="edition" id="edition" title="eCFR edition loaded in this app"></span>
    <button type="button" class="btn" id="chat-toggle" title="Ask Claude" aria-controls="chat" aria-expanded="false">
      <svg class="icon icon-accent" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.25 9.35 6.65 13.75 8 9.35 9.35 8 13.75 6.65 9.35 2.25 8 6.65 6.65Z"/></svg>
      <span class="btn-label">Ask Claude</span>
      <kbd id="chat-kbd" aria-hidden="true">Ctrl K</kbd>
    </button>
  </header>

  <div class="layout" id="layout">
    <!-- Activity rail: the app's landmarks. Home, Title start, and News are links; the others open
         a panel in the drawer beside it (nav.js). Under 900px it is a bottom bar. -->
    <nav class="activity-rail" id="activity-rail" aria-label="Workspace">
      <div class="ar-group">
        <a class="ar-btn" data-target="overview" href="#/" aria-label="Home" data-tip="Home" data-keys="G H">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7 8 2.75 13.5 7v5.25a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1Z"/><path d="M6.5 13.25V9.5h3v3.75"/></svg>
        </a>
        <a class="ar-btn" data-target="home" href="#/title/29/" id="ar-home" aria-label="Title start" data-tip="Title start" data-keys="G T">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1.25"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.25"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1.25"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.25"/></svg>
        </a>
        <span class="ar-sep" aria-hidden="true"></span>
        <button type="button" class="ar-btn" data-target="reader" aria-controls="sidebar" aria-expanded="false" aria-label="Contents" data-tip="Contents" data-keys="G C">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 12.5A1.5 1.5 0 0 1 4 11h9.5"/><path d="M4 2.5h9.5v11H4a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 4 2.5Z"/><path d="M6 5.5h4.5M6 8h3"/></svg>
        </button>
        <button type="button" class="ar-btn" data-target="projects" aria-controls="sidebar" aria-expanded="false" aria-label="Workspaces" data-tip="Workspaces" data-keys="G P">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5A1.5 1.5 0 0 1 4 3h2.6l1.4 1.5h4A1.5 1.5 0 0 1 13.5 6v6A1.5 1.5 0 0 1 12 13.5H4A1.5 1.5 0 0 1 2.5 12Z"/></svg>
        </button>
        <a class="ar-btn" data-target="news" href="#/news" aria-label="News" data-tip="News" data-keys="G N">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5H11V12a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 12Z"/><path d="M11 6.5h1.5a1 1 0 0 1 1 1V12a1.5 1.5 0 0 1-1.5 1.5"/><path d="M4.5 7h4.5M4.5 9.25h4.5M4.5 11.5h3"/></svg>
        </a>
        <button type="button" class="ar-btn" data-target="library" aria-controls="sidebar" aria-expanded="false" aria-label="Library" data-tip="Library" data-keys="G L">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 10.5v2A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5v-2"/><path d="M8 2.5v8M5 7.5 8 10.5 11 7.5"/></svg>
          <span class="ar-badge" id="ar-library-badge" hidden></span>
        </button>
      </div>
      <div class="ar-group ar-bottom">
        <button type="button" class="ar-btn" data-target="settings" aria-controls="sidebar" aria-expanded="false" aria-label="Settings" data-tip="Settings" data-keys="G S">
          <!-- A gear with teeth, not detached rays: the old circle-and-rays glyph read as a
               dark/light toggle. stroke-width compensates for the 24px grid (2.25 × 16/24 = 1.5px). -->
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke-width="2.25"/><path stroke-width="2.25" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </nav>

    <!-- The drawer: one header, one panel at a time. Panels stay mounted, so the contents
         tree keeps its place while another panel is open. -->
    <aside class="sidebar" id="sidebar" aria-labelledby="drawer-title">
      <div class="drawer-inner">
        <header class="drawer-head">
          <div class="drawer-head-text">
            <h2 class="drawer-title" id="drawer-title">Contents</h2>
            <span class="drawer-meta" id="drawer-meta"></span>
          </div>
          <div class="drawer-acts" id="drawer-acts"></div>
          <button type="button" class="icon-btn drawer-icon" id="drawer-mode" aria-pressed="true"></button>
          <button type="button" class="icon-btn drawer-icon" id="drawer-close" title="Close drawer (⌘B)" aria-label="Close drawer">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m9.5 4.5-3.5 3.5 3.5 3.5"/></svg>
          </button>
        </header>
        <section class="drawer-panel" data-panel="reader" id="panel-reader" aria-label="Contents">
          <div class="side-filter">
            <input id="tree-filter" type="search" placeholder="Filter agencies, parts, sections…" autocomplete="off" spellcheck="false" aria-label="Filter parts and sections" aria-controls="tree">
            <div class="side-nav-tabs" id="side-nav-tabs" role="tablist" aria-label="Sidebar view mode">
              <button type="button" class="side-nav-tab active" id="tab-agencies" role="tab" aria-selected="true" data-mode="agencies">By agency</button>
              <button type="button" class="side-nav-tab" id="tab-parts" role="tab" aria-selected="false" data-mode="all-parts">All parts</button>
            </div>
          </div>
          <div class="tree" id="tree"><div class="loading is-skel skel-stack" aria-label="Loading contents…"><span class="skel skel-line" style="width:76%"></span><span class="skel skel-line" style="width:58%"></span><span class="skel skel-line" style="width:68%"></span></div></div>
        </section>
        <section class="drawer-panel" data-panel="projects" id="panel-projects" aria-label="Workspaces" hidden></section>
        <section class="drawer-panel" data-panel="library" id="panel-library" aria-label="Library" hidden></section>
        <section class="drawer-panel" data-panel="settings" id="panel-settings" aria-label="Settings" hidden></section>
        <section class="drawer-panel" data-panel="history" id="panel-history" aria-label="Recent" hidden></section>
      </div>
      <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize drawer" aria-valuemin="220" aria-valuemax="560" aria-valuenow="288" tabindex="0" title="Drag to resize · double-click to reset"></div>
    </aside>
    <div class="nav-backdrop" id="nav-backdrop"></div>

    <div class="main-stage" id="main-stage">
      <main class="main" id="main" tabindex="-1">
        <div id="main-tabs" class="reader-tabs" role="tablist" aria-label="Open reader tabs" hidden></div>
        <div id="view-head" class="view-head" hidden></div>
        <div id="view" class="view"></div>
      </main>
      <aside class="split-pane" id="split-pane" aria-label="Reference split view" hidden></aside>
    </div>

    <aside class="chat" id="chat" aria-label="Ask Claude" hidden>
      <div class="chat-head">
        <strong>Ask Claude</strong>
        <select id="model-select" title="Claude model" aria-label="Claude model" hidden></select>
        <button type="button" class="icon-btn" id="chat-new" title="New conversation" aria-label="New conversation">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8.75V12a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 12V5a1.5 1.5 0 0 1 1.5-1.5h3.25"/><path d="M11.55 2.7a1.24 1.24 0 0 1 1.75 1.75L8.6 9.15l-2.3.55.55-2.3Z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="chat-close" title="Close" aria-label="Close chat">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-context" id="chat-context" hidden>
        <label><input type="checkbox" id="context-toggle" checked> Include <span id="context-label"></span></label>
      </div>
      <form class="chat-input" id="chat-form">
        <textarea id="chat-text" rows="1" placeholder="Ask about this section, or anything in Title 29…" aria-label="Message Claude"></textarea>
        <button class="send-btn" id="chat-send" type="submit" title="Send (Enter)" aria-label="Send message">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M4 7l4-4 4 4"/></svg>
        </button>
      </form>
    </aside>
  </div>

  <div id="ask-float" class="ask-float" hidden>
    <button type="button" class="btn btn-small" data-ask="explain">Explain</button>
    <button type="button" class="btn btn-small" data-ask="ask">Ask about this</button>
    <button type="button" class="btn btn-small" data-ask="clip" title="Clip passage and citation to a workspace">Clip</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <!-- Downloads in progress: a floating dock that stays mounted across routes (app.js "Transfer dock"). -->
  <div id="transfer-dock" class="transfer-dock" hidden></div>
  <div id="transfer-dock-live" class="sr-only" role="status" aria-live="polite"></div>
  <div id="nav-live" class="sr-only" role="status" aria-live="polite"></div>
  <div id="pin-pop" class="pin-pop" role="dialog" aria-label="Pin to a workspace" hidden></div>
  <div id="news-pop" class="news-pop" role="dialog" aria-label="Federal Register and OSHA activity" hidden></div>
  <div id="cite-pop" class="cite-pop" role="dialog" aria-label="Citation preview" hidden></div>
  <div id="env-modal" class="modal-backdrop" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="env-modal-title"></div>
  </div>
  <div id="figure-modal" class="modal-backdrop" hidden>
    <div class="modal-dialog fig-modal" role="dialog" aria-modal="true" aria-labelledby="fig-modal-title"></div>
  </div>
  <input type="file" id="projects-import" accept="application/json,.json" hidden>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
